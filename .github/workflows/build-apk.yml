name: Gerar APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar o codigo
        uses: actions/checkout@v4

      - name: Preparar o Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # O runner do GitHub ja vem com o Android SDK instalado em
      # /usr/local/lib/android/sdk. Nao usamos a acao
      # android-actions/setup-android porque ela tenta instalar o pacote
      # "tools", que foi removido do repositorio do Google, e o job morre
      # antes de compilar qualquer coisa.
      - name: Preparar o Android SDK
        run: |
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "SDK encontrado em: $SDK"
          ls "$SDK" || true

          SDKM="$(command -v sdkmanager || true)"
          if [ -z "$SDKM" ]; then
            SDKM="$(find "$SDK/cmdline-tools" -name sdkmanager -type f 2>/dev/null | head -n 1)"
          fi
          echo "sdkmanager: $SDKM"

          if [ -n "$SDKM" ]; then
            yes | "$SDKM" --licenses > /dev/null 2>&1 || true
            "$SDKM" "platform-tools" "platforms;android-34" "build-tools;34.0.0" > /dev/null 2>&1 || true
          fi

          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "Plataformas instaladas:"
          ls "$SDK/platforms" || true

      - name: Preparar o Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Descobrir a pasta do projeto
        id: root
        run: |
          if [ -f settings.gradle.kts ]; then
            echo "dir=." >> "$GITHUB_OUTPUT"
          elif [ -f BaixaVideo/settings.gradle.kts ]; then
            echo "dir=BaixaVideo" >> "$GITHUB_OUTPUT"
          else
            echo "::error::Nao encontrei o settings.gradle.kts. Envie a pasta do projeto para o repositorio."
            exit 1
          fi

      - name: Compilar o APK
        working-directory: ${{ steps.root.outputs.dir }}
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Publicar o APK como artefato
        uses: actions/upload-artifact@v4
        with:
          name: baixa-video-apk
          path: ${{ steps.root.outputs.dir }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

      # Gera um link publico e direto para o celular baixar o APK, sem
      # precisar de login no GitHub e sem descompactar nada:
      # https://github.com/blackzedjhin1/baixa-video/releases/latest/download/baixa-video.apk
      - name: Publicar o APK como Release
        working-directory: ${{ steps.root.outputs.dir }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk baixa-video.apk
          ls -lh baixa-video.apk
          gh release view v1.0 > /dev/null 2>&1 || \
            gh release create v1.0 --title "Baixa Video 1.0" --notes "APK gerado automaticamente pelo GitHub Actions."
          gh release upload v1.0 baixa-video.apk --clobber
